---
- name: Rebuild development environment
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    script_dir: "/home/aldo/dev/01-core-infra"
    template_dir: "{{ script_dir }}/templates"
    repo_manifest: "{{ template_dir }}/repos.manifest.jsonc"
    ollama_api_key_file: "/home/aldo/.config/ollama/api_key"
    container_test: false
    traefik_network: "traefik_net"
    home_dir: "/home/aldo"
    dev_home: "/home/aldo/dev"
    infra_dir: "/home/aldo/dev/01-core-infra"
    ansible_user: aldo
    # When non-empty, restricts the containers role to the listed service names.
    # Usage: ./install.sh -e 'limit_services=["05-media-jellyfin"]'
    limit_services: []
    tools_sentries:
      - docker
      - nvm
      - node
      - npm
      - pnpm
      - bun
      - fvm
      - tree
      - ollama
      - llama-server
      - locate
      - fish
      - hermes
      - opencode
      - fx
      - omo
      - mem0
      - freellmapi
      - script_google
      - tailscale
      - lm_sensors
      - git_filter_repo
      - git-lfs
      - fx
  pre_tasks:
    - name: Ensure bun binary is in system PATH
      file:
        src: "/home/aldo/.bun/bin/bun"
        dest: "/usr/local/bin/bun"
        state: link
        force: yes
      become: true
  roles:
    - role: "base"
      tags: [base, never]
    - role: "tools"
      tags: [tools, never]
    - role: "templates"
      tags: [templates, never]
    - role: "systemd"
      tags: [systemd, never]
    - role: "llamacpp"
      tags: [llamacpp, never]
    - role: "neo-brutalist-home"
      tags: [neo-brutalist-home, never]
    - role: "manifest-repos"
      tags: [manifest-repos, never]
    - role: "cron"
      tags: [cron, never]
    - role: "hermes-skills"
      tags: [hermes-skills, never]
    - role: "freellmapi"
      tags: [freellmapi, never]
    - role: "mesh_sync"
      tags: [mesh_sync, never]
    - role: "containers"
      tags: [containers, infra]
    - role: "nextcloud-sync"
      tags: [nextcloud-sync, never]
    - role: "05-media-storage-cleanup"
      tags: [storage-cleanup, never]
