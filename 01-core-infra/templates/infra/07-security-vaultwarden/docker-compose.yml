services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.aldof.duckdns.org
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=true
    expose:
      - "80"
      - "3012"
    volumes:
      - vaultwarden_data:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=false"
      - "sablier.enable=true"
      - "sablier.group=vaultwarden"
      - "sablier.strategy=blocking"
      - "sablier.session.duration=30m"
      - "sablier.session.inactivity=5m"

networks:
  traefik_net:
    external: true

volumes:
  vaultwarden_data: