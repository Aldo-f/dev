        - ipAllowList

    # ── Neo‑Brutalist Home (neo‑brutalist‑home.aldof.duckdns.org) ──────────────────────
    neo-brutalist-home-http:
      rule: "Host(`neo-brutalist-home.aldof.duckdns.org`)"
      entryPoints:
        - web
