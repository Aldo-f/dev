apiVersion: apps/v1
kind: Deployment
metadata:
  name: freellmapi
  namespace: default
  labels:
    app: freellmapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freellmapi
  template:
    metadata:
      labels:
        app: freellmapi
    spec:
      containers:
      - name: freellmapi
        image: 02-ai-freellmapi-freellmapi:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "3001"
        - name: HOST_BIND
          value: "0.0.0.0"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"