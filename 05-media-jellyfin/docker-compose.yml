version: '3.9'

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11
    container_name: jellyfin
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/HDD/media/movies:/media/movies
      - /mnt/HDD/media/tv:/media/tv
    networks:
      - traefik_net
    labels:
      - "traefik.enable=false"
      - "sablier.enable=true"
      - "sablier.group=jellyfin"
      - "sablier.strategy=blocking"
      - "sablier.session.duration=30m"
      - "sablier.session.inactivity=5m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:8096/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  traefik_net:
    external: true