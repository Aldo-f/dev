http:
  routers:
    # Public services (no IP allowlist)
    freellm-http:
      rule: "Host(`freellm.aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
      service: freellmapi
    freellm:
      rule: "Host(`freellm.aldof.duckdns.org`)"
      entryPoints:
        - websecure
      service: freellmapi
      tls:
        certResolver: myresolver

    nextcloud-http:
      rule: "Host(`cloud.aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
      service: nextcloud
    nextcloud:
      rule: "Host(`cloud.aldof.duckdns.org`)"
      entryPoints:
        - websecure
      service: nextcloud
      tls:
        certResolver: myresolver

    stantonius-http:
      rule: "Host(`stantonius.aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
      service: stantonius
    stantonius:
      rule: "Host(`stantonius.aldof.duckdns.org`)"
      entryPoints:
        - websecure
      service: stantonius
      tls:
        certResolver: myresolver

    vault-http:
      rule: "Host(`vault.aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
        - ipAllowList
      service: vaultwarden
    vault:
      rule: "Host(`vault.aldof.duckdns.org`)"
      entryPoints:
        - websecure
      service: vaultwarden
      tls:
        certResolver: myresolver
      middlewares:
        - ipAllowList

    homepage-http:
      rule: "Host(`aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
      service: homepage
    homepage:
      rule: "Host(`aldof.duckdns.org`)"
      entryPoints:
        - websecure
      service: homepage
      tls:
        certResolver: myresolver

    # ── Clocky clock studio (clock.dev.aldof.duckdns.org) ────────────────────
    clock-http:
      rule: "Host(`clock.dev.aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
        - ipAllowList
      service: clocky
    clock:
      rule: "Host(`clock.dev.aldof.duckdns.org`)"
      entryPoints:
        - websecure
