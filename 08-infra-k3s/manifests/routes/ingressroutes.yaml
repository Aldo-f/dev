# K3s IngressRoutes — geconverteerd uit ~/dev/04-network-traefik/routes.yml (TDD: ACME conflict opgelost, k3s-Traefik hersteld)
---
# freellmapi
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: freellm
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`freellm.aldof.duckdns.org`)
    kind: Rule
    services:
    - name: freellmapi
      port: 3001
  tls:
    secretName: freellm-tls-secret
---
# toolbox
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: toolbox
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`toolbox.aldof.duckdns.org`)
    kind: Rule
    services:
    - name: toolbox
      port: 3000
  tls:
    secretName: toolbox-tls-secret
---
