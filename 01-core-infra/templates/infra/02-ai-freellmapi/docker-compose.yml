services:
  freellmapi:
    build:
      context: /home/aldo/dev/02-ai-freellmapi
      dockerfile: Dockerfile
    env_file:
      - /home/aldo/dev/02-ai-freellmapi/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST_BIND: 0.0.0.0
    ports:
      - "3001:3001"
    volumes:
      - freellmapi-data:/app/server/data
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/ready').then((r)=>{ if(!r.ok) process.exit(1); }).catch(()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      - "traefik.enable=false"
      - "sablier.enable=true"
      - "sablier.group=freellmapi"
      - "sablier.strategy=blocking"
      - "sablier.session.duration=30m"
      - "sablier.session.inactivity=5m"
    networks:
      - traefik_net

networks:
  traefik_net:
    external: true

volumes:
  freellmapi-data: