services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./routes.yml:/etc/traefik/routes.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik_net
      - docker-stack_core-network

  hermes-tq:
    build:
      context: ../02-ai-hermes-tq
      dockerfile: Dockerfile
    container_name: hermes-tq
    restart: unless-stopped
    expose:
      - "8788"
    networks:
      - traefik_net
      - docker-stack_core-network
    environment:
      - HERMES_MODEL_BASE_URL=http://freellmapi-dev:3001/v1
      - HERMES_MODEL_PROVIDER=custom
    volumes:
      - taskqueue-data:/app/tasks
      - /home/aldo/.hermes:/root/.hermes
      - /home/aldo/dev/02-ai-hermes-skills:/home/aldo/dev/02-ai-hermes-skills:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "https://freellm.aldof.duckdns.org/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  traefik_net:
    external: true
  docker-stack_core-network:
    external: true

volumes:
  letsencrypt:
    name: 04-network-traefik_letsencrypt
    external: true
  taskqueue-data:
    name: 04-network-traefik_taskqueue-data
    external: true
