version: '3.8'

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: aldof.duckdns.org
      PUID: 1000
      PGID: 1000
    ports:
      - "3000:3000"
    volumes:
      - /home/aldo/dev/06-apps-neo-brutalist-home/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - traefik_net

  # Optional: Glances for system metrics (alternative to custom metrics collector)
  # glances:
  #   image: nicolargo/glances:latest
  #   container_name: glances
  #   pid: host
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   environment:
  #     - GLANCES_OPT=-w
  #   ports:
  #     - "61208:61208"
  #   restart: unless-stopped
  #   networks:
  #     - traefik_net

networks:
  traefik_net:
    external: true