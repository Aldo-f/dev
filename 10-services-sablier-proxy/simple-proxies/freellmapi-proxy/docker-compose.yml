networks:
  traefik_net:
    external: true
services:
  freellmapi:
    environment:
    - LISTEN="0.0.0.0:3001"
    - UPSTREAM="freellmapi:3001"
    - SABLIER_API="http://sablier:10000"
    - GROUP="freellmapi"
    - SESSION_DURATION="30m"
    image: ghcr.io/vbrandl/sablier-proxy:latest
    networks:
    - traefik_net
    restart: unless-stopped
