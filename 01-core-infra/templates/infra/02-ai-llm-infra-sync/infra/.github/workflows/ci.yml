name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: Run test suite
        run: bun test

      - name: Verify CLI status
        run: bun run src/status.ts

      - name: Verify server starts
        run: |
          timeout 5 bun run src/server.ts &
          sleep 3
          curl -s http://localhost:3003/api/status | grep -q providers && echo "Server OK"
          kill %1 2>/dev/null || true
