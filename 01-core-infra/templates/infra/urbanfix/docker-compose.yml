services:
  urbanfix:
    build:
      context: __HOME__/dev/06-apps-urbanfix
      dockerfile: Dockerfile
    container_name: urbanfix
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - traefik_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 10 http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.urbanfix.rule=Host(`urbanfix.dev.aldof.duckdns.org`)"
      - "traefik.http.routers.urbanfix.service=urbanfix"
      - "traefik.http.routers.urbanfix.entrypoints=websecure"
      - "traefik.http.services.urbanfix.loadbalancer.server.port=3000"

networks:
  traefik_net:
    external: true
