services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./routes.yml:/etc/traefik/routes.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik_net
      - docker-stack_core-network

  hermes-tq:
    build:
      context: ../02-ai-hermes-tq
      dockerfile: Dockerfile
    container_name: hermes-tq
    restart: unless-stopped
    expose:
      - "8788"
    networks:
      - traefik_net
      - docker-stack_core-network
    environment:
      - HERMES_MODEL_BASE_URL=http://freellmapi:3001/v1
      - HERMES_MODEL_PROVIDER=custom
      # --- TQ job guardrails ---
      # Restricted toolsets for spawned hermes agents (no terminal/delegation)
      - TQ_TOOLSETS=web,file,code_exec
      # Wall-clock cap per job (seconds); timed-out jobs are marked failed
      - TQ_JOB_TIMEOUT=900
      # Max bytes of output captured per run (2 MiB) so logs can't fill the volume
      - TQ_MAX_LOG_BYTES=2097152
    volumes:
      - taskqueue-data:/app/tasks
      - /home/aldo/dev/02-ai-hermes-skills:/home/aldo/dev/02-ai-hermes-skills:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8788/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  traefik_net:
    external: true
  docker-stack_core-network:
    external: true

volumes:
  letsencrypt:
    name: 04-network-traefik_letsencrypt
    external: true
  taskqueue-data:
    name: 04-network-traefik_taskqueue-data
    external: true
