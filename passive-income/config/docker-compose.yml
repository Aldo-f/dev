version: "3.8"

services:
  dashboard:
    image: traefik/whoami:latest
    container_name: passive-income-dashboard
    ports:
      - "0.0.0.0:4747:80"
    restart: unless-stopped
    user: "1000:1000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`pi3.local`)"
      - "traefik.http.routers.dashboard.entrypoints=web"

  earnapp:
    image: earnapp/earnapp:latest
    container_name: earnapp
    env_file: ../providers/earnapp/config.env
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "0.0.0.0:8765:8765"
    volumes:
      - ./providers/earnapp/data:/app/data