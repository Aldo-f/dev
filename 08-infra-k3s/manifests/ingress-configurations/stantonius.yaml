apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stantonius
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`stantonius.usful.duckdns.org`)
    kind: Rule
    services:
    - name: wordpress
      port: 4001
  tls:
    secretName: stantonius-tls-secret