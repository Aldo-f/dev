---
# Deploy containerized infrastructure components from templates/infra/<component>/
# to their runtime targets and ensure Traefik routes are in sync.
#
# Runtime targets follow the group taxonomy:
#   01-core-*      -> ~/dev/01-core-infra/<name>/
#   07-security-*  -> ~/dev/07-security-<name>/

- name: Load nextcloud vault credentials
  include_vars:
    file: "{{ lookup('env', 'HOME') }}/dev/01-core-infra/vaults/nextcloud-credentials.yml"
  no_log: true

- name: Ensure traefik_net Docker network exists
  command: docker network create {{ item }}
  register: _net_create
  failed_when: "_net_create.rc != 0 and 'already exists' not in _net_create.stderr"
  changed_when: "_net_create.rc == 0"
  become: true
  loop:
    - "{{ traefik_network }}"
    - "docker-stack_core-network"

- name: Validate requested services exist
  assert:
    that:
      - missing | length == 0
    fail_msg: "Requested services not found: {{ missing | join(', ') }}"
  vars:
    all_service_names: "{{ container_services | map(attribute='name') | list }}"
    # Handle limit_services as either a proper list or a JSON string
    _parsed_limit: >-
      {{ limit_services if (limit_services | type_debug) == 'list' else limit_services | from_json }}
    missing: "{{ _parsed_limit | difference(all_service_names) }}"
  when: limit_services | length > 0

- name: Compute the list of services to deploy
  set_fact:
    _target_services: >-
      {{ container_services
         | selectattr('name', 'in', limit_services)
         | list
         if (limit_services | length > 0)
         else container_services }}

- name: Ensure runtime directories exist for container services
  file:
    path: "{{ item.runtime_dir }}"
    state: directory
    owner: aldo
    group: aldo
    mode: '0755'
  loop: "{{ _target_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Copy docker-compose template to runtime target
  copy:
    src: "{{ template_dir }}/infra/{{ item.name }}/docker-compose.yml"
    dest: "{{ item.runtime_dir }}/docker-compose.yml"
    owner: aldo
    group: aldo
    mode: '0644'
  loop: "{{ _target_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate .env for nextcloud from vault credentials
  template:
    src: "nextcloud.env.j2"
    dest: "{{ nextcloud_runtime_dir }}/.env"
    owner: aldo
    group: aldo
    mode: '0600'
  when:
    - nextcloud_runtime_dir is defined
    - limit_services | length == 0 or '05-media-nextcloud' in limit_services
  no_log: true

- name: Generate .env for freellmapi from vault credentials
  template:
    src: "freellm.env.j2"
    dest: "{{ freellm_runtime_dir }}/.env"
    owner: aldo
    group: aldo
    mode: '0600'
  when:
    - freellm_runtime_dir is defined
    - limit_services | length == 0 or '02-ai-freellmapi' in limit_services
    - vault_freellm_encryption_key is defined
  no_log: true

- name: Ensure required external Docker volumes exist
  community.docker.docker_volume:
    name: "{{ item }}"
    state: present
  loop:
    - 04-network-traefik_letsencrypt
    - 04-network-traefik_taskqueue-data

- name: Pull images and start services via Docker Compose v2
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ item.runtime_dir }}"
  register: _compose_up
  changed_when: "'Started' in _compose_up.stdout or 'Recreated' in _compose_up.stdout or 'Created' in _compose_up.stdout"
  become_user: aldo
  become: true
  loop: "{{ _target_services }}"
  loop_control:
    label: "{{ item.name }}"

# ---- Nextcloud webroot ownership remediation ----
# The ./app bind mount (= /var/www/html) must be writable by www-data (uid 33)
# inside the container. Restores/tarball extractions reset it to aldo (1000),
# which breaks Nextcloud with "Cannot write into config directory". Enforce
# 33:33 after every deploy; only rewrite when ownership actually drifted.
- name: Check current owner of Nextcloud webroot in container
  command: docker exec nextcloud stat -c '%u:%g' /var/www/html
  register: _nc_owner
  changed_when: false
  failed_when: false
  when:
    - limit_services | length == 0 or '05-media-nextcloud' in limit_services

- name: Fix Nextcloud webroot ownership (www-data 33:33)
  command: docker exec -u root nextcloud chown -R 33:33 /var/www/html
  register: _nc_chown
  changed_when: true
  when:
    - limit_services | length == 0 or '05-media-nextcloud' in limit_services
    - _nc_owner.stdout | default('') != '33:33'

# ---- Traefik route sync ----
- name: Sync Traefik static config to runtime
  copy:
    src: "{{ template_dir }}/infra/04-network-traefik/{{ item }}"
    dest: "{{ traefik_runtime_dir }}/{{ item }}"
    owner: aldo
    group: aldo
    mode: '0644'
  loop:
    - traefik.yml
  notify: reload traefik

- name: Render Traefik dynamic routes from role vars
  template:
    src: routes.yml.j2
    dest: "{{ traefik_runtime_dir }}/routes.yml"
    owner: aldo
    group: aldo
    mode: '0644'
  notify: reload traefik
