networks:
  traefik_net:
    external: true
services:
  cockpit:
    environment:
    - LISTEN="0.0.0.0:8089"
    - UPSTREAM="cockpit:9090"
    - SABLIER_API="http://sablier:10000"
    - GROUP="cockpit"
    - SESSION_DURATION="30m"
    image: ghcr.io/vbrandl/sablier-proxy:latest
    networks:
    - traefik_net
    restart: unless-stopped
