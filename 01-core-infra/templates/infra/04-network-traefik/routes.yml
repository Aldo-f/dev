        - https-redirect
      service: homepage
    neo-brutalist-home:
      rule: "Host(`neo-brutalist-home.aldof.duckdns.org`)"
      entryPoints:
        - websecure
      service: homepage
      tls:
        certResolver: myresolver

    # dev.* subdomains (with IP allowlist)
    hermes-http:
      rule: "Host(`web.hermes.dev.aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
        - ipAllowList
      service: hermes-webui
    hermes:
      rule: "Host(`web.hermes.dev.aldof.duckdns.org`)"
      entryPoints:
        - websecure
      service: hermes-webui
      tls:
        certResolver: myresolver
      middlewares:
        - ipAllowList

    hermes-tq-http:
      rule: "Host(`tq.hermes.dev.aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
        - ipAllowList
      service: hermes-tq
    hermes-tq:
      rule: "Host(`tq.hermes.dev.aldof.duckdns.org`)"
      entryPoints:
        - websecure
      service: hermes-tq
