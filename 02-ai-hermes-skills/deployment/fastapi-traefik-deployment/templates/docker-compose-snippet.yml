```yaml
services:
  taskqueue:
    build:
      context: ../02-ai-taskqueue
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8788"
    networks:
      - traefik_net
```

- Place this snippet inside your existing `docker‑compose.yml` (same folder as `traefik.yml`).
- Adjust the `context` path if your FastAPI project lives elsewhere.
- No `ports:` mapping needed – Traefik proxies directly.
