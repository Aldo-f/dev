# Homepage Widgets Configuration
# System metrics and service health widgets for neo-brutalist dashboard

# System Resources (using custom API endpoint from existing metrics collector)
- resources:
    cpu: true
    memory: true
    disk: /
    expanded: true

# Docker Containers Status
- docker:
    label: "homepage.enable=true"
    showStats: true
    showLogs: false

# Uptime / System Info
- system:
    hostname: true
    uptime: true
    cpu: true
    memory: true
    disk: true
    network: true
    docker: true

# Custom API widget for existing metrics endpoint
- customapi:
    name: "Server Metrics"
    url: "http://127.0.0.1:8081/metrics.json"
    interval: 60
    mappings:
      - label: "Uptime"
        field: "uptime"
      - label: "RAM Used"
        field: "ram_used_gb"
        unit: "GB"
      - label: "RAM Total"
        field: "ram_total_gb"
        unit: "GB"
      - label: "RAM Usage"
        field: "ram_percent"
        unit: "%"
      - label: "HDD1 Used"
        field: "hdd1_used_gb"
        unit: "GB"
      - label: "HDD1 Total"
        field: "hdd1_total_gb"
        unit: "GB"
      - label: "HDD1 Usage"
        field: "hdd1_percent"
        unit: "%"
      - label: "SSD Used"
        field: "ssd_used_gb"
        unit: "GB"
      - label: "SSD Total"
        field: "ssd_total_gb"
        unit: "GB"
      - label: "SSD Usage"
        field: "ssd_percent"
        unit: "%"
      - label: "CPU Load (1m)"
        field: "cpu_load_1m"
      - label: "CPU Load (5m)"
        field: "cpu_load_5m"
      - label: "CPU Load (15m)"
        field: "cpu_load_15m"
      - label: "CPU Temp"
        field: "cpu_temp_celsius"
        unit: "°C"
      - label: "Subsites"
        field: "subsite_count"
      - label: "Last Updated"
        field: "last_updated"

