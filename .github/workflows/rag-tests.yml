name: RAG Tests

# Runs the Mem0 integration tests and the FastAPI endpoint test.
on:
  push:
    branches: ["**"]
    paths: ["rag/**", "tests/**", ".github/workflows/rag-tests.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag:
    name: RAG (Mem0 + API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag/requirements.txt
          pip install fastapi uvicorn httpx pytest requests python-dotenv

      - name: Run Mem0 integration test
        env:
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
        run: pytest -q tests/rag/test_mem0_integration.py

      - name: Start RAG API (background)
        run: |
          nohup python -m uvicorn rag_api:app --host 127.0.0.1 --port 8000 \
            --app-dir rag > /tmp/rag_api.log 2>&1 &
          sleep 15

      - name: Run FastAPI endpoint test
        env:
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
        run: pytest -q tests/api/test_rag_api.py
