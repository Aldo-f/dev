networks:
  traefik_net:
    external: true
services:
  radio:
    environment:
    - LISTEN="0.0.0.0:8088"
    - UPSTREAM="radio-community:3000"
    - SABLIER_API="http://sablier:10000"
    - GROUP="radio"
    - SESSION_DURATION="30m"
    image: ghcr.io/vbrandl/sablier-proxy:latest
    networks:
    - traefik_net
    restart: unless-stopped
