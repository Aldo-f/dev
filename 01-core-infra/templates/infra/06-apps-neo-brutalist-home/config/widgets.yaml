# Homepage Widgets Configuration
# System metrics and service health widgets for neo-brutalist dashboard

# System Resources (CPU, Memory, Disk)
- resources:
    cpu: true
    memory: true
    disk: /
    expanded: true

# Docker Containers Status (auto-discovers containers with label homepage.enable=true)
- docker:
    label: "homepage.enable=true"
    showStats: true
    showLogs: false

# Uptime / System Info (built-in, no external dependency)
- system:
    hostname: true
    uptime: true
    cpu: true
    memory: true
    disk: true
    network: true
    docker: true

# Note: The following widgets require API keys configured in services.yaml
# Uncomment and add keys to vault/secrets when ready:
