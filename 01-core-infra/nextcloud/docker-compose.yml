---
# Nextcloud stack — source of truth under templates/infra/05-media-nextcloud/
# The containers role copies this file to runtime_dir and runs `docker compose up -d`.
#
# Required env vars (loaded from runtime_dir/.env, generated by Ansible from vault):
#   MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD (DB), REDIS_PASSWORD
#
# Data locations (bind-mounts, match legacy hand-rolled stack so existing
#   /home/aldo/nextcloud/html, /home/aldo/dev/06-apps-nextcloud/{db,redis,nextcloud}
#   and /mnt/HDD1/nextcloud/data are reused):
#   /home/aldo/nextcloud/html               -> /var/www/html           (NC app code + config)
#   /mnt/HDD1/nextcloud/data                -> /var/www/html/data      (user uploads)
#   /home/aldo/dev/06-apps-nextcloud/db     -> /var/lib/mysql          (MariaDB data)
#   /home/aldo/dev/06-apps-nextcloud/redis  -> /data                   (Redis snapshots)

services:
  db:
    image: mariadb:10.11.6
    container_name: nextcloud-db
    restart: unless-stopped
    networks:
      - nextcloud_internal
    env_file:
      - .env
    volumes:
      - /home/aldo/dev/06-apps-nextcloud/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud_internal
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - /home/aldo/dev/06-apps-nextcloud/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    image: nextcloud:34-apache
    container_name: nextcloud
    restart: unless-stopped
    networks:
      - traefik_net
      - nextcloud_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - REDIS_HOST=redis
    volumes:
      - /home/aldo/dev/06-apps-nextcloud/nextcloud:/var/www/html
      - /mnt/HDD1/nextcloud/data:/var/www/html/data
    healthcheck:
      test: ["CMD", "curl", "-f", "-m", "10", "http://127.0.0.1:80/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes: {}

networks:
  traefik_net:
    external: true
  nextcloud_internal:
    driver: bridge