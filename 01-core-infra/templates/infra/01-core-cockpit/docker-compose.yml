services:
  cockpit:
    image: quay.io/cockpit/ws:latest
    container_name: cockpit
    restart: unless-stopped
    network_mode: host
    volumes:
      - /run:/run
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -k -m 5 https://127.0.0.1:9090/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s