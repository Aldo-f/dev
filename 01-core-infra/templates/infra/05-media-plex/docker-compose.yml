version: '3.9'

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM=
    volumes:
      - /mnt/HDD1/plex/config:/config
      - /mnt/HDD1/media/movies:/movies
      - /mnt/HDD1/media/tv:/tv
    networks:
      - traefik_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:32400/web/index.html >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  traefik_net:
    external: true