        certResolver: myresolver
      middlewares:
        - ipAllowList

    # ── Portainer (portainer.dev.aldof.duckdns.org) ────────────────────────
    portainer-http:
      rule: "Host(`portainer.dev.aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
        - ipAllowList
      service: portainer
    portainer:
      rule: "Host(`portainer.dev.aldof.duckdns.org`)"
      entryPoints:
        - websecure
      service: portainer
      tls:
        certResolver: myresolver
      middlewares:
        - ipAllowList
    cockpit-http:
      rule: "Host(`cockpit.dev.aldof.duckdns.org`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
        - ipAllowList
      service: cockpit
    cockpit:
      rule: "Host(`cockpit.dev.aldof.duckdns.org`)"
      entryPoints:
