version: "3.9"
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1000:1000
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/HDD/media:/media
    restart: unless-stopped
    ports:
      - 8096:8096
    networks:
      - traefik_net

networks:
  traefik_net:
    external: true