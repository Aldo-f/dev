---
# freellmapi (service endpoint via Docker container op host 3001)
apiVersion: v1
kind: Service
metadata:
  name: freellmapi
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: freellmapi
  namespace: default
subsets:
- addresses:
  - ip: 192.168.0.5
  ports:
  - port: 3001
---
# toolbox (service endpoint via Docker container op host 3000)
apiVersion: v1
kind: Service
metadata:
  name: toolbox
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: toolbox
  namespace: default
subsets:
- addresses:
  - ip: 192.168.0.5
  ports:
  - port: 3000
