<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Hub — *.hermes.dev.aldof.duckdns.org</title>
    <style>
        :root {
            --bg: #F4F4F0;
            --primary: #FF6B6B;
            --accent: #FFDE4D;
            --accent2: #4ECDC4;
            --accent3: #A8E6CF;
            --border: #000000;
            --text: #000000;
            --healthy: #C8E6C9;
            --running: #FFF9C4;
            --down: #FFCDD2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.6;
            background-image:
                linear-gradient(45deg, transparent 49%, rgba(0,0,0,.04) 49%, rgba(0,0,0,.04) 51%, transparent 51%),
                linear-gradient(-45deg, transparent 49%, rgba(0,0,0,.04) 49%, rgba(0,0,0,.04) 51%, transparent 51%);
            background-size: 40px 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 8px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .title-block {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: var(--accent);
            border: 4px solid var(--border);
            box-shadow: 8px 8px 0px 0px var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            transform: rotate(-3deg);
        }

        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            background: var(--accent);
            padding: 0 15px;
            border: 4px solid var(--border);
            box-shadow: 8px 8px 0px 0px var(--border);
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .pill {
            background: white;
            border: 4px solid var(--border);
            padding: 8px 15px;
            box-shadow: 4px 4px 0px 0px var(--border);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .pill.healthy { background: var(--healthy); }
        .pill.running { background: var(--running); }
        .pill.down { background: var(--down); }

        .refresh-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
            flex-wrap: wrap;
        }

        .refresh-bar input {
            flex: 1;
            min-width: 200px;
            border: 4px solid var(--border);
            padding: 10px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 4px 4px 0px 0px var(--border);
            outline: none;
        }

        button {
            text-transform: uppercase;
            font-weight: 900;
            font-family: inherit;
            padding: 10px 20px;
            border: 4px solid var(--border);
            cursor: pointer;
            box-shadow: 4px 4px 0px 0px var(--border);
            transition: all 0.1s ease;
            background: var(--accent);
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px var(--border);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border: 5px solid var(--border);
            box-shadow: 10px 10px 0px 0px var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 14px 14px 0px 0px var(--border);
        }

        .card.healthy { background: var(--healthy); }
        .card.running { background: var(--running); }
        .card.down { background: var(--down); }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .card-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .status-badge {
            font-weight: 900;
            text-transform: uppercase;
            border: 3px solid var(--border);
            padding: 4px 10px;
            font-size: 0.8rem;
            background: white;
        }

        .card-name {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            border-bottom: 3px solid var(--border);
            padding-bottom: 8px;
        }

        .card-desc {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .card-meta {
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: auto;
            padding-top: 10px;
            border-top: 2px dashed var(--border);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            word-break: break-all;
        }

        .meta-row .label {
            text-transform: uppercase;
            opacity: 0.7;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .meta-row .value {
            text-align: right;
            font-family: 'Courier New', monospace;
        }

        .open-link {
            display: inline-block;
            background: var(--accent);
            border: 3px solid var(--border);
            padding: 6px 14px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text);
            box-shadow: 3px 3px 0px 0px var(--border);
            align-self: flex-start;
            font-size: 0.85rem;
        }

        .open-link:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px 0px var(--border);
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border: 5px dashed var(--border);
            box-shadow: 10px 10px 0px 0px var(--border);
        }

        .empty h2 {
            font-size: 2rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-top: 4px solid var(--border);
            padding-top: 20px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-block">
                <div class="logo">H</div>
                <div>
                    <h1>HERMES HUB</h1>
                    <div class="subtitle">Auto-discovered <span id="domain-label">hermes.dev.aldof.duckdns.org</span> subdomains</div>
                </div>
            </div>
            <div class="stats-bar" id="stats-bar">
                <span class="pill loading" id="pill-total">…</span>
                <span class="pill healthy" id="pill-healthy">…</span>
                <span class="pill running" id="pill-running">…</span>
                <span class="pill down" id="pill-down">…</span>
            </div>
        </header>

        <div class="refresh-bar">
            <input type="text" id="search" placeholder="Filter subsystems…">
            <button onclick="loadSubsystems()">↻ Refresh</button>
        </div>

        <div class="grid" id="grid">
            <div class="empty loading">
                <h2>LOADING…</h2>
                <p>Querying Docker + Traefik labels…</p>
            </div>
        </div>

        <div class="footer">
            <div>Auto-discovers any container with a <code>Host(`*.hermes.dev.aldof.duckdns.org`)</code> Traefik label.</div>
            <div style="margin-top: 6px;">Drop a new container behind that domain → it appears here on next refresh.</div>
        </div>
    </div>

    <script>
        let allSubs = [];

        async function loadSubsystems() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '<div class="empty loading"><h2>LOADING…</h2><p>Querying Docker + Traefik labels…</p></div>';

            try {
                const res = await fetch('/api/subsystems');
                const data = await res.json();
                allSubs = data.subsystems || [];
                document.getElementById('domain-label').textContent = data.domain || 'hermes.dev.aldof.duckdns.org';
                render();
                updateStats();
            } catch (err) {
                grid.innerHTML = `<div class="empty"><h2>ERROR</h2><p>${err.message}</p></div>`;
            }
        }

        function updateStats() {
            const healthy = allSubs.filter(s => s.status === 'healthy').length;
            const running = allSubs.filter(s => s.status === 'running').length;
            const down = allSubs.filter(s => s.status === 'down').length;

            document.getElementById('pill-total').textContent = `Total ${allSubs.length}`;
            document.getElementById('pill-healthy').textContent = `Healthy ${healthy}`;
            document.getElementById('pill-running').textContent = `Up ${running}`;
            document.getElementById('pill-down').textContent = `Down ${down}`;
        }

        function render() {
            const grid = document.getElementById('grid');
            const search = (document.getElementById('search').value || '').toLowerCase();

            const filtered = allSubs.filter(s => {
                if (!search) return true;
                return s.name.toLowerCase().includes(search) ||
                       s.desc.toLowerCase().includes(search) ||
                       s.subdomain.toLowerCase().includes(search) ||
                       s.container.toLowerCase().includes(search);
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <h2>NO HERMES SUBSYSTEMS FOUND</h2>
                        <p>No running containers are exposing a <code>*.hermes.dev.aldof.duckdns.org</code> subdomain via Traefik labels.</p>
                        <p style="margin-top:10px;">Add a label like <code>traefik.http.routers.X.rule=Host(\`foo.hermes.dev.aldof.duckdns.org\`)</code> to a container and refresh.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(s => {
                const hostList = (s.all_hosts || [s.public_url])
                    .map(h => `<div class="meta-row"><span class="label">→</span><span class="value">${h}</span></div>`)
                    .join('');
                return `
                    <a class="card ${s.status}" href="${s.public_url}" target="_blank" rel="noopener">
                        <div class="card-head">
                            <div class="card-icon">${s.icon || '📦'}</div>
                            <span class="status-badge">${s.status}</span>
                        </div>
                        <div class="card-name">${s.name}</div>
                        <div class="card-desc">${s.desc}</div>
                        <div class="card-meta">
                            <div class="meta-row"><span class="label">sub</span><span class="value">${s.subdomain}.hermes.dev.aldof.duckdns.org</span></div>
                            <div class="meta-row"><span class="label">ctr</span><span class="value">${s.container}</span></div>
                            ${hostList}
                        </div>
                        <span class="open-link">OPEN →</span>
                    </a>
                `;
            }).join('');
        }

        document.getElementById('search').addEventListener('input', render);

        loadSubsystems();
        setInterval(loadSubsystems, 30000);
    </script>
</body>
</html>
